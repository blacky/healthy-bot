name: Rust CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run Tests
        run: cargo test --verbose

  # Build & publish the image, then trigger a Komodo redeploy. Runs only after
  # the `ci` job passes, only on pushes to main, and only where the Komodo
  # secrets are configured — so forks/upstream without the secrets no-op safely.
  deploy:
    name: Publish image & deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Secrets can't be referenced in job/step `if:` conditions, so surface the
      # webhook URL's presence as a step output that later steps gate on.
      - name: Check deploy secrets
        id: guard
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
        run: |
          if [ -n "$KOMODO_WEBHOOK_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KOMODO_WEBHOOK_URL not set — skipping build & deploy."
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: steps.guard.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        if: steps.guard.outputs.enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Set up Buildx
        if: steps.guard.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      # Default target is the Dockerfile `runtime` stage; the `tester` stage is
      # skipped on purpose because the `ci` job already ran the test suite.
      - name: Build & push image
        if: steps.guard.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Temporarily Disable Bot Fight Mode
        if: steps.guard.outputs.enabled == 'true'
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "Disabling Bot Fight Mode..."
          curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/bot_management" \
               -H "Authorization: Bearer $CF_API_TOKEN" \
               -H "Content-Type: application/json" \
               -d '{"fight_mode":false}'
          
          echo "Waiting 45 seconds for Cloudflare edge propagation..."
          sleep 45

# Send a GitHub-style signed webhook to Komodo's stack `/deploy` listener.
      # Komodo verifies the HMAC-SHA256 signature against KOMODO_WEBHOOK_SECRET,
      # matches the branch in the payload, then pulls the new image and recreates
      # the stack.
      - name: Trigger Komodo redeploy
        if: steps.guard.outputs.enabled == 'true'
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          payload='{"ref":"refs/heads/main"}'
          sig="sha256=$(printf '%s' "$payload" \
            | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" \
            | awk '{print $2}')"
          curl -fsS -X POST "$KOMODO_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: $sig" \
            -H "User-Agent: GitHub-Actions-Deploy" \
            -d "$payload"

# Always Re-enable Bot Fight Mode (even if the webhook fails)
      - name: Re-enable Bot Fight Mode
        if: always() && steps.guard.outputs.enabled == 'true'
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "Re-enabling Bot Fight Mode..."
          curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/bot_management" \
               -H "Authorization: Bearer $CF_API_TOKEN" \
               -H "Content-Type: application/json" \
               -d '{"fight_mode":true}'
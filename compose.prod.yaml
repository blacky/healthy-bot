# Production stack for Komodo (or any Docker host).
#
# Unlike compose.yaml (which builds from source), this runs the image published
# to GHCR by CI. Both the image path and tag are overridable:
#   - HEALTHYBOT_IMAGE: override the image owner/repo (defaults to this fork).
#   - IMAGE_TAG:        pin a specific build, e.g. `sha-abc1234`, for rollback.
#                       Defaults to `latest` (the most recent push to main).
#
# Secrets (DISCORD_TOKEN, OPENAI_SECRET, DISCORD_GUILD_ID) are supplied via .env.
services:
  healthy-bot:
    container_name: healthy-bot
    image: ${HEALTHYBOT_IMAGE:-ghcr.io/buracc/healthy-bot-rust}:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      # Keep the SQLite database on the mounted volume. Without this, DB_FILE
      # defaults to a path relative to the image WORKDIR (/app) and would be
      # lost on every redeploy.
      DB_FILE: /healthybot/db/healthybot.db
    volumes:
      - healthybot-db:/healthybot/db
      - healthybot-data:/healthybot/data
    restart: unless-stopped

volumes:
  healthybot-db:
  healthybot-data:
